<!DOCTYPE html>

<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>さわch</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0e0e14;
      --surface: #16161f;
      --card: #1e1e2a;
      --border: #2e2e42;
      --accent: #6c63ff;
      --accent2: #4ade80;
      --text: #e4e4f0;
      --muted: #666680;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; font-family: 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--text); }

```
/* ══ 画面切り替え ══ */
.screen { display: none; }
.screen.active { display: flex; flex-direction: column; }
#login.active { min-height: 100vh; align-items: center; justify-content: center; }
#thread-list-screen.active,
#thread-screen.active { height: 100vh; }

/* ══ ログイン ══ */
.login-box {
  background: var(--card); border: 1px solid var(--border); border-radius: 20px;
  padding: 48px 32px; width: 320px;
  display: flex; flex-direction: column; gap: 20px; align-items: center;
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
}
.logo { font-family: 'JetBrains Mono', monospace; font-size: 28px; color: var(--accent); }
.login-box p { font-size: 13px; color: var(--muted); text-align: center; line-height: 1.7; }
#id-input {
  width: 100%; background: var(--surface);
  border: 1.5px solid var(--border); border-radius: 12px;
  color: var(--text); font-family: 'JetBrains Mono', monospace;
  font-size: 32px; font-weight: 700; padding: 14px;
  text-align: center; outline: none; letter-spacing: 4px;
  transition: border-color .2s;
}
#id-input:focus { border-color: var(--accent); }
#id-input::placeholder { font-size: 16px; letter-spacing: 1px; color: var(--muted); }
.enter-btn {
  width: 100%; background: var(--accent); color: #fff;
  border: none; border-radius: 12px; padding: 14px;
  font-size: 16px; font-weight: 700; cursor: pointer;
  font-family: inherit;
}

/* ══ ヘッダー ══ */
.top-bar {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 0 16px; height: 52px;
  display: flex; align-items: center; gap: 10px;
  flex-shrink: 0;
}
.top-bar-title { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700; color: var(--accent); }
.top-bar-sub { font-size: 11px; color: var(--accent2); }
.back-btn {
  background: none; border: 1px solid var(--border);
  color: var(--muted); border-radius: 8px; padding: 6px 12px;
  font-size: 13px; cursor: pointer; font-family: inherit;
}
.user-badge {
  margin-left: auto; background: var(--accent); color: #fff;
  font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700;
  padding: 3px 10px; border-radius: 20px; flex-shrink: 0;
}

/* ══ スレッド一覧 ══ */
.thread-list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.thread-item {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; border-bottom: 1px solid var(--border);
  cursor: pointer; transition: background .1s;
}
.thread-item:active { background: var(--card); }
.thread-icon {
  width: 40px; height: 40px; border-radius: 10px;
  background: var(--accent); display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.thread-info { flex: 1; min-width: 0; }
.thread-title { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thread-meta { font-size: 11px; color: var(--muted); margin-top: 3px; }
.thread-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
.thread-count { font-size: 11px; color: var(--muted); }
.thread-arrow { color: var(--muted); font-size: 16px; }
.empty-msg { text-align: center; color: var(--muted); font-size: 13px; padding: 60px 20px; line-height: 2; }

/* ＋ボタン */
.fab {
  position: fixed; bottom: 28px; right: 20px;
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--accent); color: #fff; border: none;
  font-size: 28px; cursor: pointer;
  display: none;
  align-items: center; justify-content: center;
  box-shadow: 0 4px 20px rgba(108,99,255,.5);
}
.fab.visible { display: flex; }

/* ══ モーダル ══ */
.modal-overlay {
  display: none;
  position: fixed; inset: 0; background: rgba(0,0,0,.75);
  align-items: center; justify-content: center;
  z-index: 200; padding: 20px;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 18px; padding: 24px; width: 100%; max-width: 340px;
  display: flex; flex-direction: column; gap: 16px;
}
.modal h2 { font-size: 16px; font-weight: 700; }
.modal-input {
  width: 100%; background: var(--surface);
  border: 1.5px solid var(--border); border-radius: 10px;
  color: var(--text); font-family: inherit; font-size: 15px;
  padding: 12px 14px; outline: none;
}
.modal-input:focus { border-color: var(--accent); }
.modal-input::placeholder { color: var(--muted); }
.modal-actions { display: flex; gap: 10px; }
.modal-cancel {
  flex: 1; background: none; border: 1px solid var(--border);
  color: var(--muted); border-radius: 10px; padding: 12px;
  font-size: 14px; cursor: pointer; font-family: inherit;
}
.modal-submit {
  flex: 2; background: var(--accent); color: #fff;
  border: none; border-radius: 10px; padding: 12px;
  font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit;
}

/* ══ スレッド内 ══ */
.posts-area { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 0; }
.post { padding: 12px 16px; border-bottom: 1px solid var(--border); }
.post-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
.post-avatar {
  width: 26px; height: 26px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 700;
  color: #fff; flex-shrink: 0;
}
.post-id { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; color: var(--accent); }
.post-num { font-size: 11px; color: var(--muted); }
.post-time { font-size: 11px; color: var(--muted); margin-left: auto; }
.reply-btn {
  background: none; border: 1px solid var(--border); color: var(--muted);
  font-size: 11px; cursor: pointer; padding: 3px 8px;
  border-radius: 4px; font-family: inherit;
}
.reply-btn:active { background: var(--border); }
.quote-block {
  background: #13131c; border-left: 3px solid var(--accent);
  border-radius: 0 6px 6px 0; padding: 8px 10px; margin-bottom: 8px;
}
.quote-user { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--accent); margin-bottom: 3px; }
.quote-text { font-size: 12px; color: var(--muted); line-height: 1.5; word-break: break-word; }
.post-text { font-size: 14px; line-height: 1.7; word-break: break-word; white-space: pre-wrap; }

/* 入力エリア */
.post-input-area { border-top: 1px solid var(--border); background: var(--surface); flex-shrink: 0; }
.reply-indicator {
  display: none; align-items: center; gap: 8px;
  padding: 8px 16px 0; font-size: 12px; color: var(--accent);
}
.reply-indicator.show { display: flex; }
.reply-cancel { margin-left: auto; background: none; border: none; color: var(--muted); cursor: pointer; font-size: 18px; padding: 0 4px; }
.input-row { display: flex; gap: 10px; align-items: flex-end; padding: 10px 16px 14px; }
#post-input {
  flex: 1; background: var(--card);
  border: 1.5px solid var(--border); border-radius: 14px;
  color: var(--text); font-family: inherit; font-size: 14px;
  padding: 10px 14px; outline: none; resize: none;
  max-height: 100px; min-height: 42px; line-height: 1.5;
}
#post-input:focus { border-color: var(--accent); }
#post-input::placeholder { color: var(--muted); }
.post-send-btn {
  width: 42px; height: 42px; border-radius: 50%;
  background: var(--accent); color: #fff; border: none;
  font-size: 16px; cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}

::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

<body>

<!-- ログイン -->

<div id="login" class="screen active">
  <div class="login-box">
    <div class="logo">さわch</div>
    <p>数字を入力してください<br>それがあなたのユーザー名になります</p>
    <input id="id-input" type="number" placeholder="例: 1234" autocomplete="off" inputmode="numeric" />
    <button class="enter-btn" onclick="doLogin()">入室する →</button>
  </div>
</div>

<!-- スレッド一覧 -->

<div id="thread-list-screen" class="screen">
  <div class="top-bar">
    <div class="top-bar-title">さわch</div>
    <div class="top-bar-sub" id="sync-label">接続中...</div>
    <div class="user-badge" id="tl-badge"></div>
  </div>
  <div class="thread-list" id="thread-list">
    <div class="empty-msg">スレッドがありません<br>右下の ＋ から作成できます</div>
  </div>
  <button class="fab" id="fab-btn" onclick="openModal()">＋</button>
</div>

<!-- スレッド内 -->

<div id="thread-screen" class="screen">
  <div class="top-bar">
    <button class="back-btn" onclick="backToList()">← 一覧</button>
    <div style="flex:1;font-size:14px;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;" id="thread-screen-title"></div>
    <div class="user-badge" id="ts-badge"></div>
  </div>
  <div class="posts-area" id="posts-area">
    <div class="empty-msg">まだ投稿はありません</div>
  </div>
  <div class="post-input-area">
    <div class="reply-indicator" id="reply-indicator">
      <span id="reply-label"></span>
      <button class="reply-cancel" onclick="cancelReply()">✕</button>
    </div>
    <div class="input-row">
      <textarea id="post-input" placeholder="つぶやく..." rows="1" maxlength="1000"></textarea>
      <button class="post-send-btn" onclick="submitPost()">➤</button>
    </div>
  </div>
</div>

<!-- スレッド作成モーダル -->

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2>📝 新しいスレッドを作る</h2>
    <input class="modal-input" id="thread-title-input" placeholder="スレッドタイトルを入力..." maxlength="60" />
    <div class="modal-actions">
      <button class="modal-cancel" onclick="closeModal()">キャンセル</button>
      <button class="modal-submit" onclick="createThread()">作成する</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, onValue, remove, get, update, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDl8UJ_ibhxGrtZ6vfyPit5S3_vACs371U",
  authDomain: "onlychat-de190.firebaseapp.com",
  databaseURL: "https://onlychat-de190-default-rtdb.firebaseio.com",
  projectId: "onlychat-de190",
  storageBucket: "onlychat-de190.firebasestorage.app",
  messagingSenderId: "619416583908",
  appId: "1:619416583908:web:ba5b8487baa5322fb2f6f1"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ── 状態
let myId = null;
let currentThreadId = null;
let replyTarget = null;

// ── カラー
const COLORS = ['#6c63ff','#ff6b9d','#43e97b','#f7971e','#4facfe','#f953c6','#43cbff','#fa709a'];
function avatarColor(id) {
  return COLORS[String(id).split('').reduce((a,c)=>a+c.charCodeAt(0),0) % COLORS.length];
}

// ── 時刻
function fmt(ts) {
  if(!ts) return '';
  const d = new Date(ts);
  return `${d.getMonth()+1}/${d.getDate()} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
}

// ── 画面切り替え
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.getElementById('fab-btn').classList.toggle('visible', id === 'thread-list-screen');
}

// ── ログイン
document.getElementById('id-input').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
window.doLogin = function() {
  const v = document.getElementById('id-input').value.trim();
  if(!v || isNaN(v) || Number(v) <= 0) { alert('数字を入力してください'); return; }
  myId = v;
  document.getElementById('tl-badge').textContent = myId;
  document.getElementById('ts-badge').textContent = myId;
  showScreen('thread-list-screen');
  startThreadList();
};

// ── スレッド一覧
function startThreadList() {
  document.getElementById('sync-label').textContent = '✅ 同期中';
  onValue(ref(db, 'threads'), (snapshot) => {
    const data = snapshot.val() || {};
    const now = Date.now();
    const oneWeek = 7 * 24 * 60 * 60 * 1000;
    Object.entries(data).forEach(([tid, t]) => {
      if(now - (t.lastActivity || t.createdAt || 0) > oneWeek) {
        remove(ref(db, `threads/${tid}`));
        remove(ref(db, `posts/${tid}`));
      }
    });
    renderThreadList(data);
  });
}

function renderThreadList(data) {
  const list = document.getElementById('thread-list');
  const entries = Object.entries(data).sort((a,b) => (b[1].lastActivity||0) - (a[1].lastActivity||0));
  if(entries.length === 0) {
    list.innerHTML = '<div class="empty-msg">スレッドがありません<br>右下の ＋ から作成できます</div>';
    return;
  }
  list.innerHTML = '';
  const icons = ['💬','📢','🔥','✨','📝','🎯','💡','🌟'];
  entries.forEach(([tid, t]) => {
    const div = document.createElement('div');
    div.className = 'thread-item';
    div.onclick = () => openThread(tid, t.title);
    const ic = icons[String(tid).split('').reduce((a,c)=>a+c.charCodeAt(0),0) % icons.length];
    div.innerHTML = `
      <div class="thread-icon">${ic}</div>
      <div class="thread-info">
        <div class="thread-title">${esc(t.title)}</div>
        <div class="thread-meta">${fmt(t.createdAt)} ・ by ${esc(t.createdBy)}</div>
      </div>
      <div class="thread-right">
        <div class="thread-count">${t.postCount||0}件</div>
        <div class="thread-arrow">›</div>
      </div>
    `;
    list.appendChild(div);
  });
}

// ── モーダル
window.openModal = function() {
  document.getElementById('modal').classList.add('open');
  setTimeout(() => document.getElementById('thread-title-input').focus(), 100);
};
window.closeModal = function() {
  document.getElementById('modal').classList.remove('open');
  document.getElementById('thread-title-input').value = '';
};
document.getElementById('modal').addEventListener('click', function(e) {
  if(e.target === this) closeModal();
});
document.getElementById('thread-title-input').addEventListener('keydown', e => {
  if(e.key==='Enter') createThread();
});
window.createThread = async function() {
  const title = document.getElementById('thread-title-input').value.trim();
  if(!title) { alert('タイトルを入力してください'); return; }
  const now = Date.now();
  await push(ref(db, 'threads'), { title, createdBy: myId, createdAt: now, lastActivity: now, postCount: 0 });
  closeModal();
};

// ── スレッドを開く
function openThread(tid, title) {
  currentThreadId = tid;
  replyTarget = null;
  document.getElementById('thread-screen-title').textContent = title;
  document.getElementById('reply-indicator').classList.remove('show');
  document.getElementById('post-input').value = '';
  showScreen('thread-screen');
  loadPosts(tid);
}

window.backToList = function() {
  currentThreadId = null;
  replyTarget = null;
  showScreen('thread-list-screen');
};

// ── 投稿一覧
function loadPosts(tid) {
  onValue(ref(db, `posts/${tid}`), (snapshot) => {
    if(currentThreadId !== tid) return;
    const data = snapshot.val() || {};
    const area = document.getElementById('posts-area');
    const entries = Object.entries(data).sort((a,b) => (a[1].ts||0) - (b[1].ts||0));
    const wasBottom = area.scrollHeight - area.scrollTop - area.clientHeight < 100;

    if(entries.length === 0) {
      area.innerHTML = '<div class="empty-msg">まだ投稿はありません</div>';
      return;
    }
    area.innerHTML = '';
    entries.forEach(([pid, post], idx) => {
      area.appendChild(buildPost(pid, post, idx+1, data));
    });
    if(wasBottom) area.scrollTop = area.scrollHeight;
  });
}

function buildPost(pid, post, num, allPosts) {
  const div = document.createElement('div');
  div.className = 'post';
  div.id = `post-${pid}`;
  const color = avatarColor(post.userId);

  const header = document.createElement('div');
  header.className = 'post-header';
  header.innerHTML = `
    <div class="post-avatar" style="background:${color}">${String(post.userId).slice(0,3)}</div>
    <span class="post-id">${esc(post.userId)}</span>
    <span class="post-num">No.${num}</span>
    <span class="post-time">${fmt(post.ts)}</span>
    <button class="reply-btn" onclick="setReply('${pid}',${JSON.stringify(post.userId)},${JSON.stringify(post.text)})">返信</button>
  `;
  div.appendChild(header);

  if(post.replyTo && allPosts[post.replyTo]) {
    const orig = allPosts[post.replyTo];
    const preview = orig.text.length > 60 ? orig.text.slice(0,60)+'…' : orig.text;
    const q = document.createElement('div');
    q.className = 'quote-block';
    q.innerHTML = `<div class="quote-user">${esc(orig.userId)} より</div><div class="quote-text">${esc(preview)}</div>`;
    div.appendChild(q);
  }

  const body = document.createElement('div');
  body.className = 'post-text';
  body.textContent = post.text;
  div.appendChild(body);
  return div;
}

// ── 返信
window.setReply = function(pid, userId, text) {
  replyTarget = { pid, userId, text };
  const preview = text.length > 30 ? text.slice(0,30)+'…' : text;
  document.getElementById('reply-label').textContent = `↩ ${userId}「${preview}」`;
  document.getElementById('reply-indicator').classList.add('show');
  document.getElementById('post-input').focus();
};
window.cancelReply = function() {
  replyTarget = null;
  document.getElementById('reply-indicator').classList.remove('show');
};

// ── 送信
document.getElementById('post-input').addEventListener('keydown', e => {
  if(e.key==='Enter' && !e.shiftKey) { e.preventDefault(); submitPost(); }
});
document.getElementById('post-input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 100) + 'px';
});
window.submitPost = async function() {
  const inp = document.getElementById('post-input');
  const text = inp.value.trim();
  if(!text || !currentThreadId) return;
  inp.value = ''; inp.style.height = 'auto';

  const now = Date.now();
  const postData = { userId: myId, text, ts: now };
  if(replyTarget) postData.replyTo = replyTarget.pid;

  await push(ref(db, `posts/${currentThreadId}`), postData);

  const snap = await get(ref(db, `threads/${currentThreadId}`));
  if(snap.exists()) {
    await update(ref(db, `threads/${currentThreadId}`), {
      lastActivity: now,
      postCount: (snap.val().postCount || 0) + 1
    });
  }
  cancelReply();
};

function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>

</body>
