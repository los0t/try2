/* bodyは常に画面サイズ固定・スクロールなし */
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: 'Noto Sans JP', sans-serif;
  background: var(--bg); color: var(--text);
}

/* ══ 画面：1つだけ表示 ══ */
.page {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: var(--bg);
  display: none;          /* 基本は非表示 */
  flex-direction: column;
  overflow: hidden;
}
.page.show { display: flex; } /* アクティブのみ表示 */

/* ログインページだけ中央揃え */
#pg-login {
  align-items: center;
  justify-content: center;
}

/* ══ ログイン ══ */
.login-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 44px 28px;
  width: min(310px, 88vw);
  display: flex; flex-direction: column; gap: 18px; align-items: center;
  box-shadow: 0 20px 60px rgba(0,0,0,.6);
}
.logo { font-family: 'JetBrains Mono', monospace; font-size: 26px; color: var(--accent); }
.login-desc { font-size: 13px; color: var(--muted); text-align: center; line-height: 1.7; }
#id-input {
  width: 100%;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 30px; font-weight: 700;
  padding: 14px;
  text-align: center; outline: none;
  letter-spacing: 4px;
}
#id-input:focus { border-color: var(--accent); }
#id-input::placeholder { font-size: 15px; letter-spacing: 0; color: var(--muted); }
.login-btn {
  width: 100%; background: var(--accent); color: #fff;
  border: none; border-radius: 12px; padding: 14px;
  font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit;
}

/* ══ 共通ヘッダー ══ */
.header {
  height: 52px; flex-shrink: 0;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 14px; gap: 10px;
}
.h-title { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700; color: var(--accent); }
.h-sub { font-size: 11px; color: var(--green); }
.h-badge {
  margin-left: auto;
  background: var(--accent); color: #fff;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px; font-weight: 700;
  padding: 3px 10px; border-radius: 20px;
  flex-shrink: 0;
}
.h-back {
  background: none; border: 1px solid var(--border);
  color: var(--muted); border-radius: 8px;
  padding: 6px 12px; font-size: 13px;
  cursor: pointer; font-family: inherit; flex-shrink: 0;
}
.h-thread-title {
  flex: 1; font-size: 14px; font-weight: 700;
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
}

/* ══ スレッド一覧 ══ */
.list-scroll {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.thread-item {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
}
.thread-item:active { background: var(--card); }
.t-icon {
  width: 42px; height: 42px; border-radius: 10px;
  background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.t-info { flex: 1; min-width: 0; }
.t-title { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-meta { font-size: 11px; color: var(--muted); margin-top: 3px; }
.t-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
.t-count { font-size: 11px; color: var(--muted); }
.t-arrow { color: var(--muted); font-size: 16px; }
.list-empty { text-align: center; color: var(--muted); font-size: 13px; padding: 60px 20px; line-height: 2.2; }

/* ＋ボタン */
.fab {
  position: absolute; bottom: 24px; right: 20px;
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--accent); color: #fff; border: none;
  font-size: 28px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 24px rgba(108,99,255,.5);
}

/* ══ モーダル ══ */
.overlay {
  position: absolute; inset: 0;
  background: rgba(0,0,0,.75);
  display: none;
  align-items: center; justify-content: center;
  padding: 20px; z-index: 99;
}
.overlay.show { display: flex; }
.modal {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 18px; padding: 24px;
  width: 100%; max-width: 320px;
  display: flex; flex-direction: column; gap: 14px;
}
.modal h3 { font-size: 15px; }
.modal-inp {
  width: 100%; background: var(--surface);
  border: 1.5px solid var(--border); border-radius: 10px;
  color: var(--text); font-family: inherit; font-size: 15px;
  padding: 12px 14px; outline: none;
}
.modal-inp:focus { border-color: var(--accent); }
.modal-inp::placeholder { color: var(--muted); }
.modal-btns { display: flex; gap: 10px; }
.m-cancel {
  flex: 1; background: none; border: 1px solid var(--border);
  color: var(--muted); border-radius: 10px; padding: 12px;
  font-size: 14px; cursor: pointer; font-family: inherit;
}
.m-ok {
  flex: 2; background: var(--accent); color: #fff;
  border: none; border-radius: 10px; padding: 12px;
  font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit;
}

/* ══ スレッド内 ══ */
.posts-scroll {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 8px 0;
}
.post {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
}
.post:active, .post.replying { background: rgba(108,99,255,.1); }
.post-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.p-av {
  width: 26px; height: 26px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 700;
  color: #fff; flex-shrink: 0;
}
.p-id { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; color: var(--accent); }
.p-num { font-size: 11px; color: var(--muted); }
.p-time { font-size: 11px; color: var(--muted); margin-left: auto; }
.quote {
  background: #13131c; border-left: 3px solid var(--accent);
  border-radius: 0 6px 6px 0; padding: 7px 10px; margin-bottom: 7px;
}
.q-user { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--accent); margin-bottom: 2px; }
.q-text { font-size: 12px; color: var(--muted); line-height: 1.5; word-break: break-word; }
.post-body { font-size: 14px; line-height: 1.7; word-break: break-word; white-space: pre-wrap; }
.posts-empty { text-align: center; color: var(--muted); font-size: 13px; padding: 50px 20px; line-height: 2.2; }

/* 返信バナー */
.reply-bar {
  display: none;
  background: #1a1a2e;
  border-top: 1px solid var(--accent);
  padding: 8px 14px;
  align-items: center; gap: 10px;
  flex-shrink: 0;
}
.reply-bar.show { display: flex; }
.rb-body { flex: 1; min-width: 0; }
.rb-label { font-size: 11px; color: var(--accent); margin-bottom: 2px; }
.rb-preview { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rb-cancel { background: none; border: none; color: var(--muted); font-size: 22px; cursor: pointer; padding: 0 2px; flex-shrink: 0; }

/* 入力ボックス */
.input-bar {
  display: flex; align-items: flex-end; gap: 10px;
  padding: 10px 14px 14px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
#post-input {
  flex: 1;
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 14px;
  color: var(--text);
  font-family: inherit; font-size: 15px;
  padding: 10px 14px;
  outline: none; resize: none;
  min-height: 42px; max-height: 100px;
  line-height: 1.5;
  -webkit-appearance: none;
}
#post-input:focus { border-color: var(--accent); }
#post-input::placeholder { color: var(--muted); }
.send-btn {
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--accent); color: #fff; border: none;
  font-size: 18px; cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}

<body>

<!-- ページ1：ログイン -->

<div id="pg-login" class="page show">
  <div class="login-box">
    <div class="logo">さわch</div>
    <p class="login-desc">数字を入力してください<br>それがあなたのユーザー名になります</p>
    <input id="id-input" type="number" inputmode="numeric" placeholder="例: 1234" autocomplete="off" />
    <button class="login-btn" id="login-btn">入室する →</button>
  </div>
</div>

<!-- ページ2：スレッド一覧 -->

<div id="pg-list" class="page">
  <div class="header">
    <div class="h-title">さわch</div>
    <div class="h-sub" id="sync-txt"></div>
    <div class="h-badge" id="badge-list"></div>
  </div>
  <div class="list-scroll" id="thread-list">
    <div class="list-empty">スレッドがありません<br>右下の ＋ から作成できます</div>
  </div>
  <button class="fab" id="fab">＋</button>
  <!-- モーダル（このページ内に閉じ込める） -->
  <div class="overlay" id="modal-overlay">
    <div class="modal">
      <h3>📝 新しいスレッドを作る</h3>
      <input class="modal-inp" id="thread-title-inp" placeholder="タイトルを入力..." maxlength="60" inputmode="text" />
      <div class="modal-btns">
        <button class="m-cancel" id="modal-cancel">キャンセル</button>
        <button class="m-ok" id="modal-ok">作成する</button>
      </div>
    </div>
  </div>
</div>

<!-- ページ3：スレッド内 -->

<div id="pg-thread" class="page">
  <div class="header">
    <button class="h-back" id="btn-back">← 一覧</button>
    <div class="h-thread-title" id="thread-title-disp"></div>
    <div class="h-badge" id="badge-thread"></div>
  </div>
  <div class="posts-scroll" id="posts-area">
    <div class="posts-empty">まだ投稿はありません<br>下の入力欄から投稿できます</div>
  </div>
  <div class="reply-bar" id="reply-bar">
    <div class="rb-body">
      <div class="rb-label">↩ 返信中</div>
      <div class="rb-preview" id="reply-preview-txt"></div>
    </div>
    <button class="rb-cancel" id="reply-cancel-btn">✕</button>
  </div>
  <div class="input-bar">
    <textarea id="post-input" placeholder="投稿する… (投稿をタップで返信)" rows="1"></textarea>
    <button class="send-btn" id="send-btn">➤</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, onValue, remove, get, update }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

// ── Firebase
const fb = initializeApp({
  apiKey: "AIzaSyDl8UJ_ibhxGrtZ6vfyPit5S3_vACs371U",
  authDomain: "onlychat-de190.firebaseapp.com",
  databaseURL: "https://onlychat-de190-default-rtdb.firebaseio.com",
  projectId: "onlychat-de190",
  storageBucket: "onlychat-de190.firebasestorage.app",
  messagingSenderId: "619416583908",
  appId: "1:619416583908:web:ba5b8487baa5322fb2f6f1"
});
const db = getDatabase(fb);

// ── 状態
let myId = null;
let curThread = null;   // { id, title }
let replyTo = null;     // { pid, userId, text }
let postsCache = {};

// ── ページ切り替え（1つだけ表示）
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('show'));
  document.getElementById(id).classList.add('show');
}

// ── カラー
const COLORS = ['#6c63ff','#ff6b9d','#43e97b','#f7971e','#4facfe','#f953c6','#43cbff','#fa709a'];
function col(id) { return COLORS[String(id).split('').reduce((a,c)=>a+c.charCodeAt(0),0)%COLORS.length]; }
function fmt(ts) {
  if(!ts) return '';
  const d = new Date(ts);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ══════════════════════════════
//  ログイン
// ══════════════════════════════
document.getElementById('id-input').addEventListener('keydown', e => { if(e.key==='Enter') login(); });
document.getElementById('login-btn').addEventListener('click', login);

function login() {
  const v = document.getElementById('id-input').value.trim();
  if(!v || isNaN(v) || Number(v)<=0) { alert('数字を入力してください'); return; }
  myId = v;
  document.getElementById('badge-list').textContent = myId;
  document.getElementById('badge-thread').textContent = myId;
  showPage('pg-list');
  initThreadList();
}

// ══════════════════════════════
//  スレッド一覧
// ══════════════════════════════
function initThreadList() {
  document.getElementById('sync-txt').textContent = '✅ 同期中';
  onValue(ref(db,'threads'), snap => {
    const data = snap.val() || {};
    const now = Date.now();
    // 1週間経過スレを削除
    Object.entries(data).forEach(([tid,t]) => {
      if(now - (t.lastActivity||t.createdAt||0) > 7*24*60*60*1000) {
        remove(ref(db,`threads/${tid}`));
        remove(ref(db,`posts/${tid}`));
        delete data[tid];
      }
    });
    renderList(data);
  });
}

function renderList(data) {
  const el = document.getElementById('thread-list');
  const entries = Object.entries(data).sort((a,b)=>(b[1].lastActivity||0)-(a[1].lastActivity||0));
  if(!entries.length) {
    el.innerHTML = '<div class="list-empty">スレッドがありません<br>右下の ＋ から作成できます</div>';
    return;
  }
  el.innerHTML = '';
  const icons = ['💬','📢','🔥','✨','📝','🎯','💡','🌟'];
  entries.forEach(([tid,t]) => {
    const d = document.createElement('div');
    d.className = 'thread-item';
    const ic = icons[String(tid).split('').reduce((a,c)=>a+c.charCodeAt(0),0)%icons.length];
    d.innerHTML = `
      <div class="t-icon">${ic}</div>
      <div class="t-info">
        <div class="t-title">${esc(t.title)}</div>
        <div class="t-meta">${fmt(t.createdAt)} · by ${esc(String(t.createdBy||''))}</div>
      </div>
      <div class="t-right">
        <div class="t-count">${t.postCount||0}件</div>
        <div class="t-arrow">›</div>
      </div>`;
    d.addEventListener('click', () => enterThread(tid, t.title));
    el.appendChild(d);
  });
}

// ── ＋ボタン・モーダル
document.getElementById('fab').addEventListener('click', () => {
  document.getElementById('modal-overlay').classList.add('show');
  setTimeout(()=>document.getElementById('thread-title-inp').focus(),100);
});
document.getElementById('modal-cancel').addEventListener('click', closeModal);
document.getElementById('modal-overlay').addEventListener('click', e => {
  if(e.target === document.getElementById('modal-overlay')) closeModal();
});
document.getElementById('thread-title-inp').addEventListener('keydown', e => { if(e.key==='Enter') doCreate(); });
document.getElementById('modal-ok').addEventListener('click', doCreate);

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('show');
  document.getElementById('thread-title-inp').value = '';
}
async function doCreate() {
  const title = document.getElementById('thread-title-inp').value.trim();
  if(!title){ alert('タイトルを入力してください'); return; }
  const now = Date.now();
  await push(ref(db,'threads'),{title,createdBy:myId,createdAt:now,lastActivity:now,postCount:0});
  closeModal();
}

// ══════════════════════════════
//  スレッド内
// ══════════════════════════════
function enterThread(tid, title) {
  curThread = { id: tid, title };
  postsCache = {};
  replyTo = null;
  document.getElementById('thread-title-disp').textContent = title;
  document.getElementById('reply-bar').classList.remove('show');
  document.getElementById('post-input').value = '';
  document.getElementById('posts-area').innerHTML = '<div class="posts-empty">読み込み中...</div>';
  showPage('pg-thread');
  listenPosts(tid);
}

document.getElementById('btn-back').addEventListener('click', () => {
  curThread = null; replyTo = null;
  showPage('pg-list');
});

function listenPosts(tid) {
  onValue(ref(db,`posts/${tid}`), snap => {
    if(!curThread || curThread.id !== tid) return;
    postsCache = snap.val() || {};
    renderPosts(postsCache);
  });
}

function renderPosts(data) {
  const area = document.getElementById('posts-area');
  const entries = Object.entries(data).sort((a,b)=>(a[1].ts||0)-(b[1].ts||0));
  const atBottom = area.scrollHeight - area.scrollTop - area.clientHeight < 100;

  if(!entries.length) {
    area.innerHTML = '<div class="posts-empty">まだ投稿はありません<br>下の入力欄から投稿できます</div>';
    return;
  }
  area.innerHTML = '';
  entries.forEach(([pid,post],i) => {
    const div = buildPost(pid,post,i+1,data);
    area.appendChild(div);
  });
  if(atBottom) area.scrollTop = area.scrollHeight;
  if(replyTo) { const el=document.getElementById('p-'+replyTo.pid); if(el) el.classList.add('replying'); }
}

function buildPost(pid,post,num,all) {
  const div = document.createElement('div');
  div.className = 'post';
  div.id = 'p-'+pid;
  const c = col(post.userId);
  const hdr = document.createElement('div');
  hdr.className = 'post-header';
  hdr.innerHTML = `
    <div class="p-av" style="background:${c}">${String(post.userId).slice(0,3)}</div>
    <span class="p-id">${esc(post.userId)}</span>
    <span class="p-num">No.${num}</span>
    <span class="p-time">${fmt(post.ts)}</span>`;
  div.appendChild(hdr);

  if(post.replyTo && all[post.replyTo]) {
    const o = all[post.replyTo];
    const prev = o.text.length>60 ? o.text.slice(0,60)+'…' : o.text;
    const q = document.createElement('div');
    q.className = 'quote';
    q.innerHTML = `<div class="q-user">${esc(o.userId)} より</div><div class="q-text">${esc(prev)}</div>`;
    div.appendChild(q);
  }

  const body = document.createElement('div');
  body.className = 'post-body';
  body.textContent = post.text;
  div.appendChild(body);

  // タップで返信
  div.addEventListener('click', () => setReply(pid, post.userId, post.text));
  return div;
}

// ── 返信
function setReply(pid, userId, text) {
  replyTo = { pid, userId, text };
  const prev = `${userId}：${text.length>40?text.slice(0,40)+'…':text}`;
  document.getElementById('reply-preview-txt').textContent = prev;
  document.getElementById('reply-bar').classList.add('show');
  document.querySelectorAll('.post').forEach(e=>e.classList.remove('replying'));
  const t = document.getElementById('p-'+pid); if(t) t.classList.add('replying');
  document.getElementById('post-input').focus();
}
document.getElementById('reply-cancel-btn').addEventListener('click', () => {
  replyTo = null;
  document.getElementById('reply-bar').classList.remove('show');
  document.querySelectorAll('.post').forEach(e=>e.classList.remove('replying'));
});

// ── 送信
document.getElementById('post-input').addEventListener('keydown', e => {
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); doPost(); }
});
document.getElementById('post-input').addEventListener('input', function(){
  this.style.height='auto';
  this.style.height=Math.min(this.scrollHeight,100)+'px';
});
document.getElementById('send-btn').addEventListener('click', doPost);

async function doPost() {
  const inp = document.getElementById('post-input');
  const text = inp.value.trim();
  if(!text||!curThread) return;
  inp.value=''; inp.style.height='auto';

  const now = Date.now();
  const data = { userId:myId, text, ts:now };
  if(replyTo) data.replyTo = replyTo.pid;

  await push(ref(db,`posts/${curThread.id}`), data);

  const snap = await get(ref(db,`threads/${curThread.id}`));
  if(snap.exists()) {
    await update(ref(db,`threads/${curThread.id}`),{
      lastActivity: now,
      postCount: (snap.val().postCount||0)+1
    });
  }
  replyTo = null;
  document.getElementById('reply-bar').classList.remove('show');
  document.querySelectorAll('.post').forEach(e=>e.classList.remove('replying'));
}
</script>
