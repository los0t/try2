function showPage(id) {

// ── ユーティリティ
const COLORS = ['#5b52e8','#e85290','#16a34a','#d97706','#0284c7','#9333ea','#0891b2','#dc2626'];
function col(id) { return COLORS[String(id).split('').reduce((a,c)=>a+c.charCodeAt(0),0)%COLORS.length]; }
function fmt(ts) {
  if(!ts) return '';
  const d = new Date(ts);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── 画像圧縮（base64返却）
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = e => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const MAX = 600;
        let w = img.width, h = img.height;
        if(w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
        if(h > MAX) { w = Math.round(w * MAX / h); h = MAX; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.65));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// ── 長押し検出
function addLongPress(el, cb) {
  let timer=null, moved=false;
  const start=()=>{ moved=false; timer=setTimeout(()=>{ if(!moved) cb(); },600); };
  const cancel=()=>clearTimeout(timer);
  const move=()=>{ moved=true; clearTimeout(timer); };
  el.addEventListener('touchstart',start,{passive:true});
  el.addEventListener('touchend',cancel);
  el.addEventListener('touchmove',move,{passive:true});
  el.addEventListener('mousedown',start);
  el.addEventListener('mouseup',cancel);
  el.addEventListener('mousemove',move);
}

function login() {

  myId = v;

// ══════════════════════════════
//  スレッド一覧

function initThreadList() {
  document.getElementById('sync-txt').textContent = '✅ 同期中';
  onValue(ref(db,'threads'), snap=>{
    const data = snap.val()||{};
    const now = Date.now();
    Object.entries(data).forEach(([tid,t])=>{
      if(now-(t.lastActivity||t.createdAt||0) > 7*24*60*60*1000) {
        remove(ref(db,`threads/${tid}`));
        remove(ref(db,`posts/${tid}`));
        delete data[tid];
      }
    });
    renderList(data);
  });
}

function renderList(data) {
  const el = document.getElementById('thread-list');
  const entries = Object.entries(data).sort((a,b)=>(b[1].lastActivity||0)-(a[1].lastActivity||0));
  if(!entries.length) {
    el.innerHTML = '<div class="list-empty">スレッドがありません<br>右下の ＋ から作成できます</div>';
    return;
  }
  el.innerHTML = '';
  const icons = ['💬','📢','🔥','✨','📝','🎯','💡','🌟'];
  entries.forEach(([tid,t])=>{
    const d = document.createElement('div');
    d.className = 'thread-item';
    const ic = icons[String(tid).split('').reduce((a,c)=>a+c.charCodeAt(0),0)%icons.length];
    d.innerHTML = `
      <div class="t-icon">${ic}</div>
      <div class="t-info">
        <div class="t-title">${esc(t.title)}</div>
        <div class="t-meta">${fmt(t.createdAt)} · by ${esc(String(t.createdBy||''))}</div>
      </div>
      <div class="t-right">
        <div class="t-count">${t.postCount||0}件</div>
        <div class="t-arrow">›</div>
      </div>`;
    d.addEventListener('click', ()=>enterThread(tid, t.title));
    if(String(t.createdBy)===String(myId)) {
      addLongPress(d, ()=>showConfirm(`「${t.title}」を削除しますか？\n（投稿もすべて削除されます）`, async ()=>{
        await remove(ref(db,`threads/${tid}`));
        await remove(ref(db,`posts/${tid}`));
      }));
    }
    el.appendChild(d);
  });
}

// ── モーダル
document.getElementById('fab').addEventListener('click', ()=>{

document.getElementById('modal-cancel').addEventListener('click', closeModal);
document.getElementById('modal-overlay').addEventListener('click', e=>{

});
document.getElementById('thread-title-inp').addEventListener('keydown', e=>{ if(e.key==='Enter') doCreate(); });
document.getElementById('modal-ok').addEventListener('click', doCreate);
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('show');
  document.getElementById('thread-title-inp').value='';
}
async function doCreate() {
  const title = document.getElementById('thread-title-inp').value.trim();
  if(!title){ alert('タイトルを入力してください'); return; }
  const now = Date.now();
  await push(ref(db,'threads'),{title,createdBy:myId,createdAt:now,lastActivity:now,postCount:0});
  closeModal();
}

function enterThread(tid, title) {
  curThread = {id:tid, title};
  postsCache = {}; replyTo = null; pendingImg = null;
  document.getElementById('thread-title-disp').textContent = title;
  document.getElementById('reply-bar').classList.remove('show');
  document.getElementById('img-preview-wrap').classList.remove('show');
  document.getElementById('img-btn').classList.remove('has-img');
  document.getElementById('post-input').value = '';
  document.getElementById('posts-area').innerHTML = '<div class="list-empty">読み込み中...</div>';
  showPage('pg-thread');
  listenPosts(tid);
}

document.getElementById('btn-back').addEventListener('click', ()=>{
  curThread=null; replyTo=null; pendingImg=null;
  showPage('pg-list');
});

function listenPosts(tid) {
  onValue(ref(db,`posts/${tid}`), snap=>{
    if(!curThread||curThread.id!==tid) return;
    postsCache = snap.val()||{};
    renderPosts(postsCache);
  });
}

function renderPosts(data) {
  const area = document.getElementById('posts-area');
  const entries = Object.entries(data).sort((a,b)=>(a[1].ts||0)-(b[1].ts||0));
  const atBottom = area.scrollHeight-area.scrollTop-area.clientHeight < 100;
  if(!entries.length) {
    area.innerHTML = '<div class="list-empty">まだ投稿はありません<br>下の入力欄から投稿できます</div>';
    return;
  }
  area.innerHTML = '';
  entries.forEach(([pid,post],i)=>area.appendChild(buildPost(pid,post,i+1,data)));
  if(atBottom) area.scrollTop = area.scrollHeight;
  if(replyTo) { const el=document.getElementById('p-'+replyTo.pid); if(el) el.classList.add('replying'); }
}

function buildPost(pid, post, num, all) {
  const div = document.createElement('div');
  div.className = 'post';
  div.id = 'p-'+pid;
  const c = col(post.userId);
  const isMe = String(post.userId)===String(myId);

  // ヘッダー
  const hdr = document.createElement('div');
  hdr.className = 'post-header';
  hdr.innerHTML = `
    <div class="p-av" style="background:${c}">${String(post.userId).slice(0,3)}</div>
    <span class="p-id">${esc(post.userId)}</span>
    <span class="p-num">No.${num}</span>
    ${isMe?'<span class="p-mine-hint">（長押しで削除）</span>':''}
    <span class="p-time">${fmt(post.ts)}</span>`;
  div.appendChild(hdr);

  // 引用
  if(post.replyTo && all[post.replyTo]) {
    const o = all[post.replyTo];
    const prev = o.text?(o.text.length>60?o.text.slice(0,60)+'…':o.text):'（画像）';
    const q = document.createElement('div');
    q.className = 'quote';
    q.innerHTML = `<div class="q-user">${esc(o.userId)} より</div><div class="q-text">${esc(prev)}</div>`;
    div.appendChild(q);
  }

  // 本文
  if(post.text) {
    const body = document.createElement('div');
    body.className = 'post-body';
    body.textContent = post.text;
    div.appendChild(body);
  }

  // 画像（base64をそのまま表示）
  if(post.imageData) {
    const img = document.createElement('img');
    img.className = 'post-img';
    img.src = post.imageData;
    img.alt = '投稿画像';
    img.addEventListener('click', e=>e.stopPropagation());
    div.appendChild(img);
  }

  // いいね
  const likes = post.likes||{};
  const likeCount = Object.keys(likes).length;
  const iLiked = !!likes[myId];
  const footer = document.createElement('div');
  footer.className = 'post-footer';
  const likeBtn = document.createElement('button');
  likeBtn.className = 'like-btn'+(iLiked?' liked':'');
  likeBtn.innerHTML = `<span>${iLiked?'❤️':'🤍'}</span><span class="like-count">${likeCount||''}</span>`;
  likeBtn.addEventListener('click', async e=>{
    e.stopPropagation();
    if(iLiked) await remove(ref(db,`posts/${curThread.id}/${pid}/likes/${myId}`));
    else await update(ref(db,`posts/${curThread.id}/${pid}/likes`),{[myId]:true});
  });
  footer.appendChild(likeBtn);
  div.appendChild(footer);

  // タップ → 返信
  div.addEventListener('click', ()=>setReply(pid, post.userId, post.text||'（画像）'));

  // 長押し → 自分の投稿のみ削除
  if(isMe) {
    addLongPress(div, ()=>showConfirm('この投稿を削除しますか？', async ()=>{
      await remove(ref(db,`posts/${curThread.id}/${pid}`));
      const snap = await get(ref(db,`threads/${curThread.id}`));
      if(snap.exists()) await update(ref(db,`threads/${curThread.id}`),{postCount:Math.max(0,(snap.val().postCount||1)-1)});
    }));
  }
  return div;
}

// ── 返信
function setReply(pid, userId, text) {
  replyTo = {pid, userId, text};
  const prev = `${userId}：${text.length>40?text.slice(0,40)+'…':text}`;
  document.getElementById('reply-preview-txt').textContent = prev;
  document.getElementById('reply-bar').classList.add('show');
  document.querySelectorAll('.post').forEach(e=>e.classList.remove('replying'));
  const t = document.getElementById('p-'+pid); if(t) t.classList.add('replying');
  document.getElementById('post-input').focus();
}
document.getElementById('reply-cancel-btn').addEventListener('click', ()=>{
  replyTo=null;
  document.getElementById('reply-bar').classList.remove('show');
  document.querySelectorAll('.post').forEach(e=>e.classList.remove('replying'));
});

// ── 画像選択・プレビュー
document.getElementById('img-btn').addEventListener('click', ()=>{
  if(getTodayCount()>=IMG_LIMIT){ alert(`画像投稿は1日${IMG_LIMIT}枚までです`); return; }
  document.getElementById('img-file-input').click();
});
document.getElementById('img-file-input').addEventListener('change', async e=>{
  const file = e.target.files[0]; if(!file) return;
  e.target.value='';
  try {
    const compressed = await compressImage(file);
    pendingImg = compressed;
    document.getElementById('img-preview').src = compressed;
    document.getElementById('img-preview-wrap').classList.add('show');
    document.getElementById('img-btn').classList.add('has-img');
  } catch { alert('画像の読み込みに失敗しました'); }
});
document.getElementById('img-preview-del').addEventListener('click', ()=>{
  pendingImg=null;
  document.getElementById('img-preview-wrap').classList.remove('show');
  document.getElementById('img-btn').classList.remove('has-img');
});

// ── 送信
document.getElementById('post-input').addEventListener('keydown', e=>{
  if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); doPost(); }
});
document.getElementById('post-input').addEventListener('input', function(){
  this.style.height='auto';
  this.style.height=Math.min(this.scrollHeight,100)+'px';
});
document.getElementById('send-btn').addEventListener('click', doPost);

async function doPost() {
  const inp = document.getElementById('post-input');
  const text = inp.value.trim();
  if(!text && !pendingImg) return;
  if(!curThread) return;

  // 画像上限チェック
  if(pendingImg && getTodayCount()>=IMG_LIMIT) {
    alert(`画像投稿は1日${IMG_LIMIT}枚までです`); return;
  }

  inp.value=''; inp.style.height='auto';
  const now = Date.now();
  const postData = {userId:myId, text:text||'', ts:now};
  if(replyTo) postData.replyTo = replyTo.pid;
  if(pendingImg) {
    postData.imageData = pendingImg; // base64をDBに直接保存
    incTodayCount();
    pendingImg=null;
    document.getElementById('img-preview-wrap').classList.remove('show');
    document.getElementById('img-btn').classList.remove('has-img');
  }

  await push(ref(db,`posts/${curThread.id}`), postData);
  const snap = await get(ref(db,`threads/${curThread.id}`));
  if(snap.exists()) {
    await update(ref(db,`threads/${curThread.id}`),{
      lastActivity:now, postCount:(snap.val().postCount||0)+1
    });
  }
  replyTo=null;
  document.getElementById('reply-bar').classList.remove('show');
  document.querySelectorAll('.post').forEach(e=>e.classList.remove('replying'));
}
</script>
